<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Honda Sonic Red Black</title>

  <!-- A-Frame + AR.js -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #controlPanel {
      position: fixed;
      z-index: 999;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      width: min(94vw, 430px);
      padding: 14px;
      border-radius: 20px;
      background: rgba(0,0,0,.82);
      color: white;
      text-align: center;
      backdrop-filter: blur(8px);
    }

    #status {
      font-size: 14px;
      margin-bottom: 10px;
      color: #8eeaff;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 13px 25px;
      margin: 4px;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    #startBtn {
      background: #d71920;
    }

    #stopBtn {
      background: #444;
    }

    button:active {
      transform: scale(.94);
    }

    .info {
      margin-top: 7px;
      font-size: 12px;
      color: #ddd;
    }
  </style>
</head>

<body>

<div id="controlPanel">
  <div id="status">กำลังเปิดกล้อง... ส่องไปที่ Hiro Marker</div>

  <button id="startBtn" onclick="startBike()">🏍️ START / ล้อหมุน</button>
  <button id="stopBtn" onclick="stopBike()">⛔ STOP</button>

  <div class="info">AR Honda Sonic • แดง/ดำ • ล้อแม็ก</div>
</div>

<a-scene
  embedded
  vr-mode-ui="enabled:false"
  renderer="antialias:true; alpha:true"
  arjs="sourceType:webcam; trackingMethod:best; debugUIEnabled:false">

  <a-marker
    id="hiroMarker"
    preset="hiro"
    emitevents="true">

    <!-- ========================================= -->
    <!-- MOTORCYCLE GROUP -->
    <!-- ========================================= -->
    <a-entity id="motorcycle" position="0 0.15 0">

      <!-- เงารถ -->
      <a-ellipse
        position="0 0.02 0"
        rotation="-90 0 0"
        scale="1.8 .65 .65"
        color="#111"
        opacity=".35"
        material="transparent:true">
      </a-ellipse>

      <!-- ตัวถังหลักสีแดง -->
      <a-box
        position="0 .75 0"
        width="1.55"
        height=".42"
        depth=".55"
        color="#d71920"
        radius=".08">
      </a-box>

      <!-- แฟริ่งด้านหน้า -->
      <a-box
        position="-.73 .88 0"
        width=".48"
        height=".65"
        depth=".48"
        rotation="0 0 -12"
        color="#d71920">
      </a-box>

      <!-- แฟริ่งดำ -->
      <a-box
        position="-.55 .72 0"
        width=".62"
        height=".22"
        depth=".58"
        color="#111111"
        rotation="0 0 -8">
      </a-box>

      <!-- เบาะ -->
      <a-box
        position=".28 1.02 0"
        width=".72"
        height=".12"
        depth=".48"
        color="#111111"
        rotation="0 0 -3">
      </a-box>

      <!-- ท้ายรถ -->
      <a-box
        position=".75 .87 0"
        width=".48"
        height=".35"
        depth=".5"
        color="#111111"
        rotation="0 0 8">
      </a-box>

      <!-- ไฟหน้า -->
      <a-box
        position="-.98 1.02 0"
        width=".06"
        height=".22"
        depth=".28"
        color="#fff8c4"
        material="emissive:#fff8c4; emissiveIntensity:1">
      </a-box>

      <!-- ไฟท้าย -->
      <a-box
        position="1.02 .92 0"
        width=".06"
        height=".14"
        depth=".25"
        color="#ff1744"
        material="emissive:#ff1744; emissiveIntensity:.8">
      </a-box>

      <!-- แฮนด์ -->
      <a-cylinder
        position="-.45 1.24 0"
        radius=".035"
        height=".78"
        rotation="0 0 90"
        color="#222">
      </a-cylinder>

      <!-- แผงหน้าปัด -->
      <a-box
        position="-.53 1.18 0"
        width=".22"
        height=".16"
        depth=".18"
        color="#222">
      </a-box>

      <!-- กระจก -->
      <a-cylinder
        position="-.48 1.39 -.25"
        radius=".06"
        height=".04"
        rotation="90 0 0"
        color="#607d8b">
      </a-cylinder>

      <a-cylinder
        position="-.48 1.39 .25"
        radius=".06"
        height=".04"
        rotation="90 0 0"
        color="#607d8b">
      </a-cylinder>

      <!-- เครื่องยนต์ -->
      <a-box
        position=".05 .48 0"
        width=".48"
        height=".38"
        depth=".4"
        color="#424242">
      </a-box>

      <a-cylinder
        position=".05 .52 -.22"
        radius=".16"
        height=".06"
        rotation="90 0 0"
        color="#757575">
      </a-cylinder>

      <!-- ท่อไอเสีย -->
      <a-cylinder
        position=".62 .48 -.32"
        radius=".07"
        height=".75"
        rotation="0 0 90"
        color="#303030">
      </a-cylinder>

      <a-cylinder
        position="1.0 .48 -.32"
        radius=".1"
        height=".28"
        rotation="0 0 90"
        color="#111111">
      </a-cylinder>

      <!-- ================================= -->
      <!-- ล้อหลัง -->
      <!-- ================================= -->
      <a-entity id="rearWheel" position=".62 .42 0" rotation="90 0 0">

        <a-cylinder
          radius=".43"
          height=".16"
          color="#111111">
        </a-cylinder>

        <!-- ล้อแม็ก -->
        <a-torus
          radius=".31"
          radius-tubular=".045"
          color="#bdbdbd">
        </a-torus>

        <a-cylinder
          radius=".07"
          height=".20"
          color="#757575">
        </a-cylinder>

        <!-- ก้านแม็ก -->
        <a-box position=".15 0 0" width=".48" height=".035" depth=".035" color="#e0e0e0"></a-box>
        <a-box position="-.15 0 0" width=".48" height=".035" depth=".035" color="#e0e0e0"></a-box>
        <a-box position="0 .15 0" width=".035" height=".48" depth=".035" color="#e0e0e0"></a-box>
        <a-box position="0 -.15 0" width=".035" height=".48" depth=".035" color="#e0e0e0"></a-box>

      </a-entity>

      <!-- ================================= -->
      <!-- ล้อหน้า -->
      <!-- ================================= -->
      <a-entity id="frontWheel" position="-.72 .42 0" rotation="90 0 0">

        <a-cylinder
          radius=".43"
          height=".16"
          color="#111111">
        </a-cylinder>

        <!-- ล้อแม็ก -->
        <a-torus
          radius=".31"
          radius-tubular=".045"
          color="#bdbdbd">
        </a-torus>

        <a-cylinder
          radius=".07"
          height=".20"
          color="#757575">
        </a-cylinder>

        <!-- ก้านแม็ก -->
        <a-box position=".15 0 0" width=".48" height=".035" depth=".035" color="#e0e0e0"></a-box>
        <a-box position="-.15 0 0" width=".48" height=".035" depth=".035" color="#e0e0e0"></a-box>
        <a-box position="0 .15 0" width=".035" height=".48" depth=".035" color="#e0e0e0"></a-box>
        <a-box position="0 -.15 0" width=".035" height=".48" depth=".035" color="#e0e0e0"></a-box>

      </a-entity>

      <!-- ขาตั้ง -->
      <a-cylinder
        position=".15 .18 .28"
        radius=".025"
        height=".45"
        rotation="0 0 -15"
        color="#333">
      </a-cylinder>

      <!-- โลโก้/ข้อความ -->
      <a-text
        value="SONIC"
        position="0 .84 -.31"
        rotation="0 0 0"
        align="center"
        color="#ffffff"
        scale=".38 .38 .38">
      </a-text>

    </a-entity>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
  let running = false;
  let lastTime = performance.now();
  let wheelRotation = 0;

  const frontWheel = document.getElementById("frontWheel");
  const rearWheel = document.getElementById("rearWheel");
  const status = document.getElementById("status");

  const marker = document.getElementById("hiroMarker");

  marker.addEventListener("markerFound", function () {
    status.textContent = "พบ Hiro Marker ✓ Honda Sonic พร้อมใช้งาน";
  });

  marker.addEventListener("markerLost", function () {
    status.textContent = "ไม่พบ Marker — ส่องกล้องไปที่ Hiro Marker";
  });

  function startBike() {
    running = true;
    status.textContent = "🏍️ เครื่องติดแล้ว — ล้อกำลังหมุน";
  }

  function stopBike() {
    running = false;
    status.textContent = "⛔ รถหยุดแล้ว";
  }

  function animate(now) {
    const delta = (now - lastTime) / 1000;
    lastTime = now;

    if (running) {
      // หมุนล้อ
      wheelRotation += delta * 900;

      frontWheel.setAttribute(
        "rotation",
        "90 0 " + wheelRotation
      );

      rearWheel.setAttribute(
        "rotation",
        "90 0 " + wheelRotation
      );
    }

    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
</script>

</body>
</html>
